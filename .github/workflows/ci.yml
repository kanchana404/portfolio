name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

# Read-only token. Nothing here writes to the repo, and a job that runs repo
# code must not hold a token that can.
permissions:
  contents: read

# Actions are pinned to commit SHAs (the comment names the release): a tag can
# be moved to different code, a SHA cannot. Runners are pinned too, so the
# ubuntu-latest move to 26.04 cannot change the Playwright dependencies
# underneath a green build.

jobs:
  # Fast feedback. Fails in seconds on the most common mistakes, before anything
  # spends time on a build.
  static:
    name: Typecheck · Lint · Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # First, before anything installs or loads a config: pnpm install, vitest,
      # next lint and next build all execute repo code. Node on the runner is
      # enough, since the script uses builtins only.
      - run: node scripts/check-config-integrity.mjs
      # The pnpm version comes from packageManager in package.json.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The registry validator runs at module scope, so the unit suite is also
      # what proves the shipped content is valid. It is the cheapest check here
      # and the one most likely to fail, because it validates hand-written prose
      # rather than code.
      - run: pnpm test

      - run: pnpm typecheck
      - run: pnpm lint

      # Enforce the connection-pool rule mechanically.
      #
      # Every lambda that touches db/index.ts opens its own Atlas pool, so a
      # statically generated tool page must never touch the database at all.
      # Reviewers forget; grep does not.
      #
      # Deliberately wider than just the route directory: the widgets and the
      # registry live outside `src/app/(tools)/` and are imported *into* it, so
      # scanning only the routes would miss the realistic version of this bug.
      - name: No database imports in tool code
        run: |
          if grep -rnE "from ['\"]@db(/|['\"])" \
               "src/app/(tools)/" src/lib/tools/ src/components/tools/ ; then
            echo "::error::Tool code must never import from @db. Use a route handler."
            exit 1
          fi
          echo "ok — no @db import in tool code"

  build:
    name: Build · Bundle budget
    runs-on: ubuntu-24.04
    needs: static
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # First, before anything installs or loads a config: pnpm install, vitest,
      # next lint and next build all execute repo code. Node on the runner is
      # enough, since the script uses builtins only.
      - run: node scripts/check-config-integrity.mjs
      # The pnpm version comes from packageManager in package.json.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # No MONGODB_URI on purpose. sitemap.ts and the blog routes must survive
      # without it — their try/catch fallbacks are load-bearing, and this is what
      # proves they work rather than assuming so.
      - run: pnpm build

      - run: pnpm budget

  browser:
    name: Browser tests
    runs-on: ubuntu-24.04
    needs: static
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # First, before anything installs or loads a config: pnpm install, vitest,
      # next lint and next build all execute repo code. Node on the runner is
      # enough, since the script uses builtins only.
      - run: node scripts/check-config-integrity.mjs
      # The pnpm version comes from packageManager in package.json.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      # playwright.config.ts builds and starts the production server itself.
      # These assert the things unit tests cannot: that the widget is in the HTML
      # before JavaScript runs, that typing sends nothing, that layout does not
      # shift, and that an unknown slug 404s.
      - run: pnpm test:browser

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-24.04
    needs: static
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # First, before anything installs or loads a config: pnpm install, vitest,
      # next lint and next build all execute repo code. Node on the runner is
      # enough, since the script uses builtins only.
      - run: node scripts/check-config-integrity.mjs
      # The pnpm version comes from packageManager in package.json.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # build:only, not build — `build` runs the unit suite, which the `static`
      # job this depends on has already done.
      - run: pnpm build:only

      # Asserts the Core Web Vitals the bundle budget cannot see: LCP, total
      # blocking time, and CLS. The CLS assertion is the one that matters most —
      # Lighthouse simulates a throttled connection, which is the only condition
      # under which the hydration-gap class of shift is visible at all. See
      # docs/adr/0003 for the regression this exists to catch.
      # The URL list is generated rather than checked in: the homepage, /blog
      # and /privacy always, plus sampled tools only while that section is
      # live, so a retired section cannot point the audit at a 410. See
      # scripts/lighthouse-config.ts. The CLI version is exact.
      - run: pnpm lighthouse:config
      - run: pnpm dlx @lhci/cli@0.14.0 autorun --config=lighthouserc.generated.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 7
